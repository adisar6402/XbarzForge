kind = "web"
previewPath = "/"
title = "XbarzForge"
version = "1.0.0"
id = "artifacts/xbarzforge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21285

[services.development]
run = "pnpm --filter @workspace/xbarzforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xbarzforge", "run", "build" ]
serve = "static"
publicDir = "artifacts/xbarzforge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21285"
BASE_PATH = "/"
