<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XbarzForge — Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Courier New', monospace;
        background: #0a0a0c;
        color: #e2e8f0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        border: 2px solid #0BD9EB;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #0BD9EB;
        font-size: 1.5rem;
        font-weight: bold;
      }
      h1 { font-size: 1.5rem; color: #0BD9EB; margin-bottom: 0.5rem; }
      p { color: #64748b; font-size: 0.875rem; max-width: 360px; line-height: 1.6; margin-bottom: 2rem; }
      a {
        display: inline-block;
        padding: 0.625rem 1.5rem;
        background: #0BD9EB;
        color: #0a0a0c;
        font-weight: bold;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.875rem;
        transition: opacity 0.15s;
      }
      a:hover { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="icon">&gt;_</div>
    <h1>XbarzForge</h1>
    <p>You appear to be offline. Connect to the internet to access AI-powered code analysis and other features.</p>
    <a href="/">Try Again</a>
  </body>
</html>
